# Render Blueprint: Helix as a hosted demo (API + dashboard + Postgres).
# Recorded evidence and the rules arm only - no cluster, Kafka, Jenkins,
# Slack or LLM key. The password and intake token are generated by Render
# and never live in git; read them in the service's Environment tab.
# GCP remains the course's cloud deployment (plan.md D23); this is a demo.
services:
  - type: web
    name: helix
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: HELIX_DATABASE_URL
        fromDatabase:
          name: helix-db
          property: connectionString
      - key: HELIX_UI_PASSWORD
        generateValue: true
      - key: HELIX_INTAKE_TOKEN
        generateValue: true
      - key: HELIX_ENVIRONMENT
        value: demo
      - key: HELIX_EVIDENCE_SOURCE
        value: fixtures
      - key: HELIX_ARM
        value: A
      - key: HELIX_WORK_PROVIDER
        value: memory
      - key: HELIX_GRAPH_ENABLED
        value: "false"
      - key: HELIX_VERIFY_FUNCTIONAL
        value: "false"

databases:
  - name: helix-db
    plan: free
    databaseName: helix
    user: helix
