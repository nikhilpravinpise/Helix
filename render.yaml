# Render Blueprint: Helix as a hosted demo (API + dashboard + Postgres).
# Recorded evidence and the rules arm only - no cluster, Kafka, Jenkins or
# LLM key. Slack, Jira and GitHub are connected from the dashboard's
# Connections page (OAuth); the pull request bot opens real PRs only once
# it is switched on there. Access is Sign in with GitHub, allowed users from
# config/service_registry.yaml's people. The OAuth app's id and secret are
# entered in Render's dashboard (sync: false); the session key and intake
# token are generated by Render. None of them live in git.
# GCP remains the course's cloud deployment (plan.md D23); this is a demo.
services:
  - type: web
    name: helix
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: HELIX_DATABASE_URL
        fromDatabase:
          name: helix-db
          property: connectionString
      - key: HELIX_GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: HELIX_GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: HELIX_SESSION_SECRET
        generateValue: true
      - key: HELIX_INTAKE_TOKEN
        generateValue: true
      # Connections page (helix/connections_ui.py): stored OAuth tokens are
      # encrypted under this key. Slack and Atlassian app credentials are
      # entered in Render's dashboard.
      - key: HELIX_CONNECTIONS_KEY
        generateValue: true
      - key: HELIX_SLACK_CLIENT_ID
        sync: false
      - key: HELIX_SLACK_CLIENT_SECRET
        sync: false
      # Verifies Slack button clicks posted to /slack/interactions.
      - key: HELIX_SLACK_SIGNING_SECRET
        sync: false
      # The Helix GitHub App behind Connect GitHub (installation, no OAuth);
      # the private key is the app's PEM, "\n" sequences allowed.
      - key: HELIX_GITHUB_APP_ID
        sync: false
      - key: HELIX_GITHUB_APP_SLUG
        sync: false
      - key: HELIX_GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: HELIX_JIRA_OAUTH_CLIENT_ID
        sync: false
      - key: HELIX_JIRA_OAUTH_CLIENT_SECRET
        sync: false
      - key: HELIX_ENVIRONMENT
        value: demo
      - key: HELIX_EVIDENCE_SOURCE
        value: fixtures
      # The server resumes runs in-process after a dashboard approval or
      # review decision; fixture mode needs a recording to replay.
      - key: HELIX_FIXTURE_PATH
        value: ci/docker-build-failure
      - key: HELIX_ARM
        value: A
      - key: HELIX_WORK_PROVIDER
        value: memory
      - key: HELIX_GRAPH_ENABLED
        value: "false"
      - key: HELIX_VERIFY_FUNCTIONAL
        value: "false"

databases:
  - name: helix-db
    plan: free
    databaseName: helix
    user: helix
