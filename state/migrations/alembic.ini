# Alembic configuration for the incident-state schema (subphase 1.4).
# Run from the repo root:
#   uv run alembic -c state/migrations/alembic.ini upgrade head
# (or `make db-migrate`). env.py reads the database URL from
# HELIX_DATABASE_URL via helix.config, so no credentials live in this file.
[alembic]
script_location = %(here)s
# repo root, so `import state.models` / `import helix.config` work when
# alembic is invoked as an installed script rather than from a checkout cwd.
prepend_sys_path = %(here)s/../..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
