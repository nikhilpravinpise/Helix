# GitHub category - stale branch (CONTEXT.md section 18).
#
# Fault (fixtures/faults/github/stale-branch.json): branch
# feature/timeout-tuning has fallen far behind main (diverged, mergeable
# no) and can no longer merge cleanly. The remediation is re-authoring the
# change on a fresh helix/INC-* branch cut from current main; the
# catalogue has no rebase action by design.
name: stale-branch
category: github
fault: stale-branch
optimal_action: open_fix_pr
valid_actions:
  - open_fix_pr     # re-author the change on a branch cut from current main
  - rerun_pipeline  # re-run checks on the updated branch; alone it changes nothing (harmless)
unsafe_actions:
  - restart_deployment   # wrong target: runtime write for a repo-state fault
  - rollback_deployment  # wrong target
  - scale_deployment     # wrong target
approval_gated: false
# --- 1.11 benchmark fields ---
root_cause: >-
  Branch feature/timeout-tuning has diverged 14 commits behind main and
  is unmergeable, so the timeout change it carries must be re-authored on
  a fresh branch cut from current main.
inject: fixture
evidence_fixture: github/stale-branch
signal:
  source: github
  service: payment-api
  environment: sandbox
  severity: medium
  signature:
    type: branch_state
    branch: feature/timeout-tuning
    comparison: diverged
    behind_by: 14
  raw:
    branch: feature/timeout-tuning
    base: main
requires:
  - postgres
expected_final_state:
  status: recovered
  executed_action: open_fix_pr
  output_contains:
    - sandbox/payment-api/k8s/02-configmap.yaml
  measured: []
