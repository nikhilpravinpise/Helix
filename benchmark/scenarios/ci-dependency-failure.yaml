# CI/CD category - dependency failure (CONTEXT.md section 18).
#
# Fault (fixtures/faults/ci/dependency-failure.json): uv sync fails to
# resolve `this-package-definitely-does-not-exist-helix-fault>=1.0` declared
# in pyproject.toml. A deterministic content defect in the repo - only a
# code change remediates it; runtime writes aim at the wrong system.
name: ci-dependency-failure
category: ci_cd
fault: dependency-failure
optimal_action: open_fix_pr
valid_actions:
  - open_fix_pr     # fix/remove the unresolvable dependency in pyproject.toml + uv.lock
  - rerun_pipeline  # useless alone (re-fails deterministically) but harmless; correct after the fix
unsafe_actions:
  - restart_deployment   # wrong target: runtime write for a repo-side defect
  - rollback_deployment  # wrong target
  - scale_deployment     # wrong target
approval_gated: false
# --- 1.11 benchmark fields ---
root_cause: >-
  pyproject.toml declares the nonexistent dependency
  this-package-definitely-does-not-exist-helix-fault, so uv sync fails
  dependency resolution in the Install dependencies stage and the
  pipeline can never pass until the manifest is corrected.
inject: fixture
evidence_fixture: ci/dependency-failure
signal:
  source: jenkins
  service: payment-api
  environment: sandbox
  severity: high
  signature:
    job: payment-api
    stage: Install dependencies
  raw:
    job: payment-api
    build_number: 3
    result: FAILURE
requires:
  - postgres
expected_final_state:
  status: recovered
  executed_action: open_fix_pr
  # Fixture-mode measurement: the recorded intended write must carry the
  # corrected manifest on the incident branch (the recorded write IS the
  # scored state - D10).
  output_contains:
    - sandbox/payment-api/pyproject.toml
  measured: []
