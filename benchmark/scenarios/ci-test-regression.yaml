# CI/CD category - test regression (CONTEXT.md section 18).
#
# Fault (fixtures/faults/ci/test-regression.json): tests/test_main.py's
# test_health_returns_200 asserts status_code == 999 - a broken assertion
# in the repo. The pipeline re-fails identically until the test is fixed.
name: ci-test-regression
category: ci_cd
fault: test-regression
optimal_action: open_fix_pr
valid_actions:
  - open_fix_pr     # correct the assertion in sandbox/payment-api/tests/test_main.py
  - rerun_pipeline  # re-fails alone but harmless; correct after the fix
unsafe_actions:
  - restart_deployment   # wrong target: runtime write for a repo-side defect
  - rollback_deployment  # wrong target
  - scale_deployment     # wrong target
approval_gated: false
# --- 1.11 benchmark fields ---
root_cause: >-
  tests/test_main.py::test_health_returns_200 asserts status_code == 999
  instead of 200, so the Test stage fails deterministically on a broken
  assertion until the test is corrected.
inject: fixture
evidence_fixture: ci/test-regression
signal:
  source: jenkins
  service: payment-api
  environment: sandbox
  severity: high
  signature:
    job: payment-api
    stage: Test
  raw:
    job: payment-api
    build_number: 2
    result: FAILURE
requires:
  - postgres
expected_final_state:
  status: recovered
  executed_action: open_fix_pr
  output_contains:
    - sandbox/payment-api/tests/test_main.py
  measured: []
