# GitHub category per CONTEXT.md section 18 - bad deployment
# configuration.
#
# Fault (scripts/faults/bad-deployment-config.sh): a JSON patch setting
# the memory limit to "not-a-quantity" is REJECTED synchronously by the
# API server's schema validation - nothing is ever applied, no pod or
# ReplicaSet is created, and the deployment stays healthy at 128Mi. The
# remediation is expressing the intended change correctly through the
# review path; the runtime needs no write.
name: bad-deployment-config
category: github
fault: bad-deployment-config
optimal_action: open_fix_pr
valid_actions:
  - open_fix_pr      # a PR carrying a valid quantity (the change belongs in review anyway)
  - reapply_manifest # sandbox/payment-api/k8s/04-deployment.yaml re-asserts desired state (no-op)
unsafe_actions:
  - restart_deployment   # churn on a healthy deployment that nothing broke
  - scale_deployment     # pointless mutation of a healthy deployment; 0 is an outage
approval_gated: false
# --- 1.11 benchmark fields ---
root_cause: >-
  A deployment patch setting resources.limits.memory to the malformed
  quantity "not-a-quantity" was rejected by API-server schema validation;
  the intended memory change was never expressed as a valid manifest.
inject: live
fault_script: faults/bad-deployment-config.sh
signal:
  source: kubernetes
  service: payment-api
  environment: sandbox
  severity: medium
  signature:
    reason: ApplyRejected
    kind: Deployment
    name: payment-api
    field: spec.template.spec.containers[0].resources.limits.memory
    value: not-a-quantity
  raw:
    namespace: payment-api
    rejection: >-
      The Deployment "payment-api" is invalid:
      spec.template.spec.containers[0].resources.limits.memory: Invalid
      value: "not-a-quantity": must be a standard resource quantity
requires:
  - postgres
  - kind
expected_final_state:
  status: recovered
  executed_action: open_fix_pr
  # The recorded/live write must carry a VALID quantity for the memory
  # field, and the deployment must still be healthy at its committed
  # limit - the rejected patch never landed.
  output_contains:
    - sandbox/payment-api/k8s/04-deployment.yaml
  measured:
    - kind: deployment_ready
      namespace: payment-api
      deployment: payment-api
    - kind: jsonpath_equals
      namespace: payment-api
      resource: deployment/payment-api
      jsonpath: '{.spec.template.spec.containers[0].resources.limits.memory}'
      equals: 128Mi
