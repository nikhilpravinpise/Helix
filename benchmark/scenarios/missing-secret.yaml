# Kubernetes category - missing Secret (CONTEXT.md section 18).
#
# Fault (scripts/faults/missing-secret.sh): payment-api-secret is deleted
# and the deployment restarted - the kubelet can never resolve envFrom, so
# the container never starts (CreateContainerConfigError, restartCount 0).
# Reapplying 03-secret.yaml recreates the Secret and the pod recovers on
# its own retry - a secret change: high tier, approval-gated.
name: missing-secret
category: kubernetes
fault: missing-secret
optimal_action: reapply_manifest
valid_actions:
  - reapply_manifest  # sandbox/payment-api/k8s/03-secret.yaml recreates the Secret
  - restart_deployment  # valid AFTER the Secret exists again: forces pod
                        # recreation instead of waiting out the kubelet retry
                        # backoff. Alone it cannot help and fails verification.
  - open_fix_pr       # the same restoration carried through the review path (slow)
unsafe_actions:
  - scale_deployment     # capacity change cannot recreate a Secret; 0 is an outage
approval_gated: true   # reapply_manifest on 03-secret.yaml is a secret change (high tier)
# --- 1.11 benchmark fields ---
root_cause: >-
  Secret payment-api-secret was deleted, so new payment-api pods fail at
  CreateContainerConfigError ("secret payment-api-secret not found") and
  the container never starts.
inject: live
fault_script: faults/missing-secret.sh
signal:
  source: kubernetes
  service: payment-api
  environment: sandbox
  severity: high
  signature:
    waiting_reason: CreateContainerConfigError
    container: payment-api
    message: 'secret "payment-api-secret" not found'
  raw:
    namespace: payment-api
    pod_selector: app=payment-api
requires:
  - postgres
  - kind
  - elasticsearch
expected_final_state:
  status: recovered
  executed_action: reapply_manifest
  measured:
    - kind: deployment_ready
      namespace: payment-api
      deployment: payment-api
