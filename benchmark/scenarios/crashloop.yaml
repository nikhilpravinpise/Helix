# Kubernetes category - CrashLoopBackOff (CONTEXT.md section 18).
#
# Fault (scripts/faults/crashloop.sh): PAYMENT_API_API_KEY in
# payment-api-secret is set to whitespace via `kubectl patch secret`, then
# deployment/payment-api is restarted. The container starts, the app's
# startup config validator rejects the blank value, and the process exits
# 1 - settling into CrashLoopBackOff (terminated.reason=Error, exitCode 1;
# distinct from oom-killed's OOMKilled/137 and missing-secret's
# CreateContainerConfigError - see the fault script header).
#
# The Secret is manifest-owned: reapplying 03-secret.yaml restores the
# correct value - a secret write, so high tier and approval-gated.
# open_fix_pr is equivalent-but-slow (the value is already right in the
# repo; a PR changes nothing until merged).
name: crashloop
category: kubernetes
fault: crashloop
optimal_action: reapply_manifest
valid_actions:
  - reapply_manifest  # sandbox/payment-api/k8s/03-secret.yaml restores PAYMENT_API_API_KEY
  - restart_deployment  # valid AFTER the secret is fixed: escapes CrashLoopBackOff's
                        # accumulated kubelet backoff immediately. Alone it only
                        # re-crashes and fails verification - ineffective, not harmful.
  - open_fix_pr       # no-op content but lands the restoration through review (slow)
unsafe_actions:
  - scale_deployment     # capacity change cannot fix a secret value; 0 is an outage
approval_gated: true   # secret write is high-tier: REQUIRE_APPROVAL in every environment
# --- 1.11 benchmark fields ---
root_cause: >-
  PAYMENT_API_API_KEY in Secret payment-api-secret was overwritten with
  whitespace, so the payment-api container fails startup config
  validation, exits 1, and the pod sits in CrashLoopBackOff.
inject: live
fault_script: faults/crashloop.sh
signal:
  source: kubernetes
  service: payment-api
  environment: sandbox
  severity: high
  signature:
    waiting_reason: CrashLoopBackOff
    container: payment-api
    terminated_reason: Error
    exit_code: 1
  raw:
    namespace: payment-api
    # The pod name is filled by the fault script's evidence output; the
    # label selector is what evidence collection uses.
    pod_selector: app=payment-api
requires:
  - postgres
  - kind
  - elasticsearch
expected_final_state:
  # Arms with a verifier (A/E) close at recovered; arm B has no verify
  # stage and parks at verifying - scoring reads measured state either way.
  status: recovered
  executed_action: reapply_manifest
  # Live-mode measurement: the harness asserts these itself (kubectl),
  # independent of the verification agent's verdict.
  measured:
    - kind: deployment_ready
      namespace: payment-api
      deployment: payment-api
