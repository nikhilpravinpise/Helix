# GitHub category - rejected PR (CONTEXT.md section 18). Fixture payload
# crafted in 1.11 (D10); action sets are declared now and refined then.
#
# Fault: a pull request receives a changes-requested review. The
# remediation is a corrected PR on the incident branch; re-running checks
# only makes sense after the fix lands.
name: rejected-pr
category: github
fault: rejected-pr
optimal_action: open_fix_pr
valid_actions:
  - open_fix_pr     # address the review on a helix/INC-* branch
  - rerun_pipeline  # re-run checks after the fix; alone it changes nothing (harmless)
unsafe_actions:
  - restart_deployment   # wrong target: runtime write for a review-process fault
  - rollback_deployment  # wrong target
  - scale_deployment     # wrong target
approval_gated: false
