# CI/CD category per CONTEXT.md section 18 - configuration mismatch,
# injected at the cluster (scripts/faults/config-mismatch.sh).
#
# Fault: `kubectl set env deployment/payment-api
# PAYMENT_API_DOWNSTREAM_URL=http://downstream-does-not-exist.invalid` -
# an out-of-band env override on the Deployment wedges the rollout (new
# ReplicaSet never ready, old one keeps serving). The committed manifests
# are still correct: envFrom is shadowed by the injected env entry, and
# `kubectl apply` does not own - so cannot remove - a field that only ever
# arrived via `set env` (see scripts/reset.sh, which must null the env
# list explicitly). reapply_manifest therefore CANNOT remediate this
# fault; open_fix_pr has nothing to fix (the repo is already right).
name: config-mismatch
category: ci_cd
fault: config-mismatch
optimal_action: rollback_deployment
valid_actions:
  - rollback_deployment  # rollout undo restores the pod template without the env override
unsafe_actions:
  - restart_deployment   # churn during a wedged rollout; the override persists
  - scale_deployment     # capacity change does not remove the override; scale to 0 is an outage
approval_gated: false
# --- 1.11 benchmark fields ---
root_cause: >-
  An out-of-band PAYMENT_API_DOWNSTREAM_URL env override on
  deployment/payment-api points at a nonexistent host, so new pods fail
  readiness and the rollout wedges with the old ReplicaSet still serving.
inject: live
fault_script: faults/config-mismatch.sh
signal:
  source: kubernetes
  service: payment-api
  environment: sandbox
  severity: high
  # No bad waiting reason - the new pods run but never go Ready, so the
  # fault-identifying field is the wedged rollout itself (the whole
  # signature feeds the dedup fingerprint for kubernetes signals without
  # waiting_reason/container - docs/architecture/state-machine.md).
  signature:
    deployment: payment-api
    symptom: rollout_wedged
    detail: new ReplicaSet pods fail readiness probes; old ReplicaSet still serving
  raw:
    namespace: payment-api
    deployment: payment-api
requires:
  - postgres
  - kind
  - elasticsearch
expected_final_state:
  status: recovered
  executed_action: rollback_deployment
  measured:
    - kind: deployment_ready
      namespace: payment-api
      deployment: payment-api
