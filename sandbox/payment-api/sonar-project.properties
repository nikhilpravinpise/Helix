# SonarQube analysis config for the payment-api sandbox service, consumed
# by the sonar-scanner-cli container the Jenkinsfile's `SonarQube analysis`
# stage runs (mounted at /usr/src, so paths are relative to this file's
# directory). subphase 1.13.
sonar.projectKey=payment-api
sonar.projectName=payment-api
sonar.projectVersion=0.1.0

sonar.sources=payment_api
sonar.tests=tests

sonar.python.version=3.12
# The Jenkins Test stage produces this (pytest --cov ... --cov-report=xml).
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/k8s/**,**/.venv/**
