<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Helix{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/ui/">helix<span class="brand-sub">ops</span></a>
  <nav class="nav">
    <a href="/ui/"{% if active == "incidents" %} class="active"{% endif %}>Incidents</a>
    <a href="/ui/approvals"{% if active == "approvals" %} class="active"{% endif %}>Approvals
      {%- if pending_count %}<span class="pill">{{ pending_count }}</span>{% endif -%}
    </a>
  </nav>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
