[project]
name = "helix"
version = "0.1.0"
description = "Helix - evidence-constrained agentic DevOps recovery platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "openai>=3.14.0",
    "httpx>=0.28.1",
    "kubernetes>=36.0.3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.53",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.5",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "jinja2>=3.1.6",
    "confluent-kafka>=2.6",
    "neo4j>=5.26",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "selenium>=4.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
helix = "helix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["helix", "agent", "state", "integrations", "benchmark", "events", "graph"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# *_check.py picks up tests/e2e/selenium_check.py (integration tier);
# test_*.py stays the default unit/integration test shape.
python_files = ["test_*.py", "*_check.py"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that need live infrastructure (kind/ES/Jenkins/Postgres/LLM)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
