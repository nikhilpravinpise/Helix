[project]
name = "helix"
version = "0.1.0"
description = "Helix - evidence-constrained agentic DevOps recovery platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "openai>=3.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
helix = "helix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["helix", "agent", "state", "integrations"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that need live infrastructure (kind/ES/Jenkins/Postgres/LLM)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
