# Service registry: who owns and reviews each service, and how to reach
# them. This is the LIVE team. Owners and reviewers are GitHub logins, which
# is what Review's self-review exclusion compares with a PR's author. The
# benchmark and tests read benchmark/service_registry.yaml instead (a fixed
# cast their expectations name), so edit this file freely.
#
# Select another file with HELIX_SERVICE_REGISTRY.
#
# path_owners follow git CODEOWNERS order: the LAST matching pattern wins, so
# list broad rules first and specific ones after. fnmatch's `*` matches `/`.
services:
  payment-api:
    team: payments
    repo: VrajVed/helix-sandbox
    default_owner: VrajVed
    owners:
      - VrajVed
      - nikhilpravinpise
    default_reviewers:
      - nikhilpravinpise
      - VrajVed
    depends_on:
      - postgres
    path_owners:
      - pattern: "sandbox/payment-api/*"
        owners:
          - VrajVed
      - pattern: "sandbox/payment-api/k8s/*"
        owners:
          - VrajVed
          - nikhilpravinpise

# How to show and ping each person. `slack` is a Slack member id (profile ->
# ... -> Copy member ID); without one the name is shown and nobody is pinged.
people:
  VrajVed:
    name: Vraj
    slack: U0C6A5NE7MZ
  nikhilpravinpise:
    name: Nikhil
